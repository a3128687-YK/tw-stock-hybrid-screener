name: Ingest FinMind to Supabase

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "Comma-separated stock ids. Leave empty for default symbols."
        required: false
        default: "3228,3661,3443,3035,2330,2454"
      mainstream:
        description: "Use the built-in 60-stock mainstream pool."
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "30 11 * * 1-5"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Ingest selected stocks
        if: ${{ github.event.inputs.mainstream != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TARGET_STOCKS: ${{ github.event.inputs.stocks || '3228,3661,3443,3035,2330,2454' }}
        run: python scripts/ingest_finmind_to_supabase.py

      - name: Ingest mainstream pool
        if: ${{ github.event.inputs.mainstream == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/ingest_finmind_to_supabase.py --mainstream

