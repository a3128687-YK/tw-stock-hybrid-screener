services:
  - type: web
    name: tw-stock-hybrid-screener
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINMIND_TOKEN
        sync: false
      - key: TW_STOCK_DB
        value: data/tw_stock_screener.sqlite3

